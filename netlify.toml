[build]
  command = "python3 scripts/normalize-no-drama.py && python3 scripts/sync-archives.py && python3 scripts/site-structure.py && python3 scripts/photo-originality.py && python3 scripts/final-normalize.py && python3 scripts/article-style.py && python3 scripts/canonical-redirects.py"
  publish = "."

[[redirects]]
  from = "/italiano.html"
  to = "/italiano"
  status = 301
  force = true

[[redirects]]
  from = "/it"
  to = "/italiano"
  status = 301
  force = true

[[redirects]]
  from = "/it/"
  to = "/italiano"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/italiano"
  status = 301
  force = true

[[redirects]]
  from = "/storie/storie-degli-altri.html"
  to = "/storie/storie-di-andrea.html"
  status = 301
  force = true

[[redirects]]
  from = "/stories/other-peoples-stories.html"
  to = "/stories/andreas-stories.html"
  status = 301
  force = true

[[redirects]]
  from = "/"
  to = "/index-en.html"
  status = 200
  force = true
