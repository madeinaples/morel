name: Render social cards

on:
  push:
    paths:
      - 'assets/social/*.svg'
      - '.github/workflows/render-social-cards.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install --disable-pip-version-check cairosvg
      - name: Render PNG cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          folder = Path('assets/social')
          for svg in folder.glob('*.svg'):
              png = svg.with_suffix('.png')
              cairosvg.svg2png(url=str(svg), write_to=str(png), output_width=1200, output_height=630)
              print(f'Rendered {png}')
          PY
      - name: Commit rendered cards
        run: |
          if git diff --quiet -- assets/social/*.png; then
            echo "No rendered changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social/*.png
          git commit -m "Render social card PNGs [skip ci]"
          git push
