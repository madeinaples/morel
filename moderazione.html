<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#090b0b">
  <title>M0REL · Moderazione</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090b0b;color:#eee9de;font-family:"DM Sans",Arial,sans-serif}main{width:min(980px,calc(100% - 32px));margin:0 auto;padding:54px 0 90px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:36px;padding-bottom:24px;border-bottom:1px solid rgba(255,255,255,.14)}h1{margin:0;font:400 clamp(34px,7vw,72px)/.95 "Newsreader",Georgia,serif}.eyebrow{margin:0 0 8px;text-transform:uppercase;letter-spacing:.17em;font-size:10px;opacity:.55}.status{font-size:11px;opacity:.65}.login{max-width:520px;padding:24px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.025)}.login p{font:300 17px/1.5 "Newsreader",Georgia,serif;opacity:.8}.row{display:flex;gap:8px}.row input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.18);background:#111;color:#eee9de;padding:12px 14px;border-radius:8px}.button{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.09);color:#eee9de;padding:12px 15px;border-radius:8px;cursor:pointer;font:500 11px/1 "DM Sans",Arial,sans-serif}.button.danger{border-color:rgba(224,100,90,.45);color:#ffb8b0}.toolbar{display:none;justify-content:space-between;align-items:center;gap:12px;margin:0 0 18px}.toolbar.active{display:flex}.comments{display:grid;gap:12px}.card{border:1px solid rgba(255,255,255,.11);padding:18px;background:rgba(255,255,255,.018)}.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.name{font-size:12px;font-weight:500}.date,.path{font-size:10px;opacity:.52}.path{display:block;margin-top:4px;overflow-wrap:anywhere}.message{margin:14px 0 16px;font:300 17px/1.5 "Newsreader",Georgia,serif;white-space:pre-wrap;overflow-wrap:anywhere}.card-actions{display:flex;gap:8px;align-items:center}.empty{font:300 19px/1.5 "Newsreader",Georgia,serif;opacity:.6}.error{margin-top:12px;color:#ffb8b0;font-size:11px}.hidden{display:none!important}@media(max-width:650px){main{padding-top:28px}.top{align-items:flex-start;flex-direction:column}.row{flex-direction:column}.card-head{flex-direction:column;gap:5px}}
  </style>
</head>
<body>
<main>
  <header class="top"><div><p class="eyebrow">M0REL · Private</p><h1>Moderazione</h1></div><div class="status" id="summary">Commenti e risposte</div></header>

  <section class="login" id="login">
    <p>Inserisci la chiave privata di moderazione. Non viene salvata sul sito: resta soltanto in questa sessione del browser.</p>
    <div class="row"><input id="token" type="password" autocomplete="current-password" placeholder="Chiave privata"><button class="button" id="enter" type="button">Entra</button></div>
    <p class="error" id="login-error"></p>
  </section>

  <div class="toolbar" id="toolbar"><span class="status" id="count"></span><div><button class="button" id="refresh" type="button">Aggiorna</button> <button class="button" id="logout" type="button">Esci</button></div></div>
  <section class="comments" id="comments"></section>
</main>
<script>
(() => {
  const API='/.netlify/functions/engagement';
  const login=document.querySelector('#login');
  const tokenInput=document.querySelector('#token');
  const enter=document.querySelector('#enter');
  const loginError=document.querySelector('#login-error');
  const toolbar=document.querySelector('#toolbar');
  const count=document.querySelector('#count');
  const comments=document.querySelector('#comments');
  const refresh=document.querySelector('#refresh');
  const logout=document.querySelector('#logout');
  let token=sessionStorage.getItem('morel-admin-token')||'';

  const fmt=(iso)=>{try{return new Intl.DateTimeFormat('it-IT',{dateStyle:'medium',timeStyle:'short'}).format(new Date(iso))}catch{return ''}};

  async function api(method,body,query=''){
    const response=await fetch(API+query,{method,headers:{'content-type':'application/json','x-morel-admin-token':token},body:body?JSON.stringify(body):undefined});
    const data=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(data.error||'request_failed');
    return data;
  }

  function showLoggedIn(){login.classList.add('hidden');toolbar.classList.add('active')}
  function showLoggedOut(){login.classList.remove('hidden');toolbar.classList.remove('active');comments.innerHTML='';count.textContent=''}

  function render(items){
    comments.innerHTML='';
    count.textContent=`${items.length} comment${items.length===1?'o':'i'}`;
    if(!items.length){const p=document.createElement('p');p.className='empty';p.textContent='Nessun commento pubblicato.';comments.appendChild(p);return}
    items.forEach(item=>{
      const card=document.createElement('article');card.className='card';
      const head=document.createElement('div');head.className='card-head';
      const who=document.createElement('div');
      const name=document.createElement('div');name.className='name';name.textContent=item.name+(item.parentId?' · risposta':'');
      const path=document.createElement('a');path.className='path';path.href=item.content+'.html';path.target='_blank';path.rel='noopener noreferrer';path.textContent=item.content;
      who.append(name,path);
      const date=document.createElement('time');date.className='date';date.dateTime=item.createdAt;date.textContent=fmt(item.createdAt);
      head.append(who,date);
      const message=document.createElement('p');message.className='message';message.textContent=item.message;
      const actions=document.createElement('div');actions.className='card-actions';
      const open=document.createElement('a');open.className='button';open.href=item.content+'.html#morel-comments';open.target='_blank';open.rel='noopener noreferrer';open.textContent='Apri pagina';
      const del=document.createElement('button');del.type='button';del.className='button danger';del.textContent='Elimina';
      del.addEventListener('click',async()=>{
        if(!confirm(`Eliminare il commento di ${item.name}? Se ha risposte, verranno eliminate anche quelle.`)) return;
        del.disabled=true;
        try{await api('POST',{action:'admin_delete_comment',content:item.content,commentId:item.id});await load()}catch{alert('Impossibile eliminare il commento.')}finally{del.disabled=false}
      });
      actions.append(open,del);card.append(head,message,actions);comments.appendChild(card);
    });
  }

  async function load(){
    loginError.textContent='';
    try{const data=await api('GET',null,'?admin=1');showLoggedIn();render(data.comments||[])}catch(e){showLoggedOut();loginError.textContent=e.message==='unauthorized'?'Chiave non valida o non ancora configurata su Netlify.':'Errore nel caricamento.';throw e}
  }

  enter.addEventListener('click',async()=>{token=tokenInput.value.trim();if(!token)return;sessionStorage.setItem('morel-admin-token',token);try{await load()}catch{sessionStorage.removeItem('morel-admin-token')}});
  tokenInput.addEventListener('keydown',e=>{if(e.key==='Enter')enter.click()});
  refresh.addEventListener('click',()=>load().catch(()=>{}));
  logout.addEventListener('click',()=>{token='';sessionStorage.removeItem('morel-admin-token');tokenInput.value='';showLoggedOut()});

  if(token) load().catch(()=>{}); else showLoggedOut();
})();
</script>
</body>
</html>
